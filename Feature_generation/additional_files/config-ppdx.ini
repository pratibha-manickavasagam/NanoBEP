[ppdx]

# Working directory (default to CWD/models)
#WRKDIR      = #### setting this directly in compute_descriptors.py

# ZRANK
# Directory containing the zrank executable
ZRANK       = /home/hamsa/Desktop/Pratibha_env/zrank2_linux/

# Rykunov-Fiser Statistical Pair Potentials (RFSPP)
# Directory containing the calc_energy executable and the two files potential 
# files RF_CB_SRS_OD and RF_HA_SRS
RFSPP       = /home/hamsa/Desktop/Pratibha_env/rfcb_1

# FoldX
# Directory where to find the FoldX executable and the file rotabase.txt
FOLDX       = /home/hamsa/Desktop/Pratibha_env/foldx

# iPot
# Directory where to find binaries aace167, aace18, aace20, rrce20
IPOT        = /home/hamsa/Desktop/Pratibha_env/iPot

# pyDock
# Directory where to find the pydock3 binary
PYDOCK      = /home/hamsa/Desktop/Pratibha_env/pyDock3/

# CHARMM
# Directory where to find the charmm binary
CHARMM      = /home/hamsa/linux-apps/charmm2/bin/charmm
FFPATH      = /home/hamsa/linux-apps/charmm2/toppar

# ATTRACT
# Main ATTRACT directory where to find 'bin', 'tools', ...
# You need also pdb2pqr python module available for python2. Can get it with APBS.
ATTRACT     = /home/hamsa/Desktop/Pratibha_env/attract

# FireDock
# Main FireDock directory
FIREDOCK    = /home/hamsa/Desktop/Pratibha_env/FireDock

# Directory where rosetta is installed
ROSETTA     = /home/hamsa/Desktop/Pratibha_env/rosetta
ROSETTABIN  = /home/hamsa/Desktop/Pratibha_env/rosetta/source/bin

